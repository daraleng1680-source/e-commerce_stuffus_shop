{% extends "storefront/base.html" %}

{% block title %}Sign In - Stuffus{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="bg-white rounded-4 border p-5 shadow-sm">
            <div class="text-center mb-5">
                <h2 class="text-extra-bold mb-2">Welcome Back</h2>
                <p class="text-muted small">Sign in to manage your orders and profile</p>
            </div>
            
            <form method="POST" action="{{ url_for('storefront.customer_login') }}" class="d-flex flex-column gap-4">
                <div>
                    <label class="small text-muted mb-1">Email Address</label>
                    <input type="email" name="email" class="form-control rounded-3 bg-light border-0 py-2" required placeholder="name@example.com">
                </div>
                
                <div>
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="small text-muted mb-0">Password</label>
                        <a href="#" class="text-muted" style="font-size: 0.7rem;">Forgot?</a>
                    </div>
                    <input type="password" name="password" class="form-control rounded-3 bg-light border-0 py-2" required placeholder="••••••••">
                </div>
                
                <div class="d-flex align-items-center gap-2">
                    <input type="checkbox" id="remember" name="remember" class="form-check-input">
                    <label for="remember" class="small text-muted mb-0">Keep me signed in</label>
                </div>
                
                <button type="submit" class="btn btn-dark w-100 rounded-pill py-3 text-bold shadow-sm">
                    Sign In
                </button>
            </form>
            
            <div class="text-center mt-5 pt-4 border-top">
                <p class="small text-muted mb-0">New to Stuffus? <a href="{{ url_for('storefront.customer_register') }}" class="text-dark text-bold text-decoration-none">Create account</a></p>
            </div>
        </div>
        
        <div class="text-center mt-4">
            <a href="{{ url_for('storefront.shop') }}" class="text-muted small text-decoration-none">
                <i class="fa fa-arrow-left me-2"></i> Back to Shop
            </a>
        </div>
    </div>
</div>
{% endblock %}
