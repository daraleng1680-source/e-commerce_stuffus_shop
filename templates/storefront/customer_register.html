{% extends "storefront/base.html" %} {% block title %}Create Account - Stuffus{%
endblock %} {% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-5">
    <div class="bg-white rounded-4 border p-5 shadow-sm">
      <div class="text-center mb-5">
        <h2 class="text-extra-bold mb-2">Join Stuffus</h2>
        <p class="text-muted small">Elevate your shopping experience today</p>
      </div>

      <form
        method="POST"
        action="{{ url_for('storefront.customer_register') }}"
        class="d-flex flex-column gap-4"
      >
        <div>
          <label class="small text-muted mb-1">Full Name</label>
          <input
            type="text"
            name="name"
            class="form-control rounded-3 bg-light border-0 py-2"
            required
            placeholder="John Doe"
          />
        </div>

        <div>
          <label class="small text-muted mb-1">Email Address</label>
          <input
            type="email"
            name="email"
            class="form-control rounded-3 bg-light border-0 py-2"
            required
            placeholder="name@example.com"
          />
        </div>

        <div>
          <label class="small text-muted mb-1">Password</label>
          <input
            type="password"
            name="password"
            class="form-control rounded-3 bg-light border-0 py-2"
            required
            placeholder="Create a password"
          />
          <p class="text-muted mb-0 mt-1" style="font-size: 0.65rem">
            Min. 6 characters with letters and numbers
          </p>
        </div>

        <div>
          <label class="small text-muted mb-1">Confirm Password</label>
          <input
            type="password"
            name="confirm_password"
            class="form-control rounded-3 bg-light border-0 py-2"
            required
            placeholder="Repeat your password"
          />
        </div>

        <div class="d-flex align-items-center gap-2">
          <input
            type="checkbox"
            id="agree"
            name="agree"
            class="form-check-input"
            required
          />
          <label for="agree" class="small text-muted mb-0"
            >I agree to the
            <a href="#" class="text-dark text-decoration-underline"
              >Terms of Service</a
            ></label
          >
        </div>

        <button
          type="submit"
          class="btn btn-dark w-100 rounded-pill py-3 text-bold shadow-sm"
        >
          Create Account
        </button>
      </form>

      <div class="text-center mt-5 pt-4 border-top">
        <p class="small text-muted mb-0">
          Already a member?
          <a
            href="{{ url_for('storefront.customer_login') }}"
            class="text-dark text-bold text-decoration-none"
            >Sign In</a
          >
        </p>
      </div>
    </div>

    <div class="text-center mt-4">
      <a
        href="{{ url_for('storefront.shop') }}"
        class="text-muted small text-decoration-none"
      >
        <i class="fa fa-arrow-left me-2"></i> Back to Shop
      </a>
    </div>
  </div>
</div>
{% endblock %}
