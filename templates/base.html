<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard - Stuffus Admin{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-dashboard.css') }}">
    
    <style>
        :root {
            --primary-color: #1e3a5f;
            --accent-orange: #ff9500;
            --bg-dark: #0f1419;
            --bg-light: #f5f6fa;
            --card-white: #ffffff;
            --text-dark: #2c2c2c;
            --text-secondary: #718096;
            --border-light: #e8e8e8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f6fa 0%, #eef1f8 100%);
            min-height: 100vh;
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }

        /* ============ SIDEBAR ============ */
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, var(--primary-color) 0%, #152d4a 100%);
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .sidebar-logo {
            padding: 30px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .sidebar-logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--accent-orange) 0%, #ff8c00 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            font-weight: 900;
            margin: 0 auto 12px;
            box-shadow: 0 6px 16px rgba(255, 149, 0, 0.3);
        }

        .sidebar-logo h3 {
            font-size: 1.1rem;
            font-weight: 800;
            margin: 0 0 4px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sidebar-logo p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            margin: 0;
        }

        .sidebar-menu {
            list-style: none;
            padding: 20px 0;
        }

        .sidebar-menu li {
            margin: 0;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 24px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .sidebar-menu a:hover {
            background: rgba(255, 149, 0, 0.15);
            color: white;
            padding-left: 28px;
        }

        .sidebar-menu a.active {
            background: linear-gradient(90deg, rgba(255, 149, 0, 0.2) 0%, transparent 100%);
            color: var(--accent-orange);
            border-left: 4px solid var(--accent-orange);
            padding-left: 24px;
        }

        .sidebar-menu i {
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        /* ============ MAIN CONTENT ============ */
        .main-content {
            margin-left: 260px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .topbar {
            background: white;
            padding: 16px 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-bottom: 1px solid var(--border-light);
        }

        .content-area {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        /* ============ SCROLLBAR ============ */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -260px;
                top: 0;
                width: 260px;
                height: 100vh;
                z-index: 2000;
                transition: left 0.3s ease;
            }

            .sidebar.active {
                left: 0;
            }

            .main-content {
                margin-left: 0 !important;
            }

            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                z-index: 1500;
                backdrop-filter: blur(4px);
            }

            .sidebar-overlay.active {
                display: block;
            }
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body style="min-height: 100vh;">
    <div class="dashboard-container">
        <!-- SIDEBAR OVERLAY FOR MOBILE -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <!-- SIDEBAR -->
        {% include 'components/sidebar.html' %}
        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- TOP BAR -->
            {% include 'components/topbar.html' %}
            <!-- PAGE CONTENT -->
            <div class="content-area">
                {% block content %}{% endblock %}
            </div>
            <!-- FOOTER -->
            {% include 'components/footer.html' %}
        </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    
    <!-- Chart Utilities -->
    <script src="{{ url_for('static', filename='js/charts-utils.js') }}"></script>
    
    <!-- Common JS Functions -->
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    
    <!-- Dashboard JS -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    
    <!-- Flash Messages Handler -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check for success message in page
            const urlParams = new URLSearchParams(window.location.search);
            const message = urlParams.get('message');
            const messageType = urlParams.get('type');
            
            console.log('🔍 DOMContentLoaded - Message:', message, 'Type:', messageType);
            
            if (message && messageType) {
                console.log('✅ Calling showAlert with:', messageType, message);
                showAlert(messageType, message);
                // Clean URL to remove query parameters
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
        
        function showAlert(type, message) {
            console.log('🚨 showAlert called - Type:', type, 'Message:', message);
            const isAutoClose = type === 'success' || type === 'info';
            
            const config = {
                icon: type === 'success' ? 'success' : type === 'error' ? 'error' : 'info',
                title: type === 'success' ? 'Success!' : type === 'error' ? 'Error!' : 'Info',
                text: message,
                background: '#fff',
                backdrop: true,
                allowOutsideClick: true,
                allowEscapeKey: true,
                didOpen: (modal) => {
                    console.log('✅ Alert opened');
                }
            };
            
            if (isAutoClose) {
                config.timer = 2000;
                config.timerProgressBar = true;
                config.showConfirmButton = false;
            } else {
                config.showConfirmButton = true;
                config.confirmButtonText = 'OK';
                config.confirmButtonColor = type === 'error' ? '#d32f2f' : '#22a54a';
            }
            
            return Swal.fire(config);
        }
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
